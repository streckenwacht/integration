[project]
name = "streckenwacht"
version = "0.9.1"
description = "Home Assistant integration: roadworks, closures, traffic jams and accidents for your routes in Germany."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14.2"

[dependency-groups]
# Local development (works on Windows): imports Home Assistant, runs provider tests.
dev = [
    "homeassistant==2026.10.4",
    "pytest",
    "pytest-asyncio",
    "ruff",
]
# Home Assistant test harness. Linux only (needs fcntl), installed in CI.
# Its version must pin the same homeassistant version as the dev group.
ha-tests = [
    "pytest-homeassistant-custom-component==0.13.375",
]

[tool.uv]
package = false
default-groups = ["dev"]
# homeassistant 2026.10.4 pins Pillow==12.3.0 (Dependabot alerts, fixed in 13.0.0).
# Dev environment only; drop once the pinned homeassistant requires Pillow>=13.
override-dependencies = ["pillow>=13.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# The cache provider leaves undeletable temp dirs on the network drive.
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py314"
extend-exclude = ["tools/brand", "*.md"]
# Keep the cache off the network drive (permission errors there).
cache-dir = "~/.cache/ruff"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "DTZ"]
# E501: line length is handled by the formatter.
# RUF001/RUF003: German texts legitimately use typographic dashes.
ignore = ["E501", "RUF001", "RUF003"]

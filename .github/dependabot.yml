version: 2
updates:
  # Keep CI actions current (e.g. setup-uv only publishes full version tags).
  # Python packages are deliberately not managed here: homeassistant and
  # pytest-homeassistant-custom-component must be bumped together by hand.
  - package-ecosystem: github-actions
    directory: /
    # main only takes fast-forwards from dev (git push origin dev:main);
    # a PR merged into main would make the branches diverge.
    target-branch: dev
    schedule:
      interval: monthly
    commit-message:
      prefix: "CI"
